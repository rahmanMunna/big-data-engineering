services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    restart: unless-stopped

    ports:
      - "9870:9870"

    volumes:
      - namenode_data:/hadoop/dfs/name

    environment:
      - CLUSTER_NAME=bigdata-lab

    env_file:
      - ./hadoop.env

    networks:
      - hadoop-network


  datanode1:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode1
    restart: unless-stopped

    ports:
      - "9864:9864"

    volumes:
      - datanode1_data:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    depends_on:
      - namenode

    networks:
      - hadoop-network


  datanode2:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode2
    restart: unless-stopped

    ports:
      - "9865:9864"

    volumes:
      - datanode2_data:/hadoop/dfs/data

    environment:
      SERVICE_PRECONDITION: "namenode:9870"

    env_file:
      - ./hadoop.env

    depends_on:
      - namenode

    networks:
      - hadoop-network


volumes:
  namenode_data:
  datanode1_data:
  datanode2_data:


networks:
  hadoop-network:
    driver: bridge
